name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, dev]

# A new push to the same branch supersedes the previous run rather than queueing
# behind it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint & types
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` over `npm install`: installs exactly what package-lock.json
      # specifies and fails if the two have drifted, so CI can't silently pass
      # against different dependency versions than a developer has locally.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
